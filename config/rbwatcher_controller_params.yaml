# Static one-robot equivalent of the configuration generated by
# generate_benchmark_assets.py.  The benchmark launcher generates this block for
# every requested robot, so this file is primarily useful for inspection and
# compatibility launches.
/mujoco/controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

/mujoco/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    use_urdf_to_filter: true

/**:
  ros__parameters:
    mujoco_plugins:
      camera:
        type: mujoco_ros2_control_plugins/CameraPlugin
        camera_publish_rate: 25.0
        rbwatcher_1_front_camera:
          policy: streaming
          publish_depth: false
          frame_name: rbwatcher_1/front_rgbd_camera_color_optical_frame
          info_topic: /rbwatcher_1/front_rgbd_camera/color/camera_info
          image_topic: /rbwatcher_1/front_rgbd_camera/color/image_raw
          depth_topic: /rbwatcher_1/front_rgbd_camera/depth/image_raw
        rbwatcher_1_top_camera:
          policy: streaming
          publish_depth: true
          frame_name: rbwatcher_1/top_rgbd_camera_color_optical_frame
          info_topic: /rbwatcher_1/top_rgbd_camera/color/camera_info
          image_topic: /rbwatcher_1/top_rgbd_camera/color/image_raw
          depth_topic: /rbwatcher_1/top_rgbd_camera/depth/image_raw
      lidar:
        type: mujoco_ros2_control_plugins/Mujoco3dLidarPlugin
        rbwatcher_1_lidar:
          frame_name: rbwatcher_1/top_3d_laser_link
          topic: /rbwatcher_1/top_laser/points
      imu_1:
        type: mujoco_ros2_control_plugins/ImuPlugin
        sensor_name: rbwatcher_1_imu
        frame_name: rbwatcher_1/imu_link
        topic: /rbwatcher_1/imu/data
        publish_rate: 100.0
      free_joint_states:
        type: mujoco_ros2_control_plugins/FreeJointStatePublisherPlugin
        frame_id: ""
        body_names: [rbwatcher_1_base_link]
        topic: /mujoco/free_joint_states
        publish_rate: 100.0
      base_velocity_1:
        type: mujoco_ros2_control_plugins/BaseVelocityPlugin
        body: rbwatcher_1_base_link
        cmd_vel_topic: /rbwatcher_1/cmd_vel
        use_stamped_twist: false
        max_linear_velocity: 2.0
        max_yaw_rate: 2.0
        cmd_timeout: 0.5
