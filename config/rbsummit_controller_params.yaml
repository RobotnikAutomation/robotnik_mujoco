/**:
  controller_manager:
    ros__parameters:
      use_sim_time: true
      update_rate: 100
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      robotnik_base_controller:
        type: robotnik_controllers/RBSummitController
      joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController
  joint_state_broadcaster:
    ros__parameters:
      use_sim_time: true
      publish_rate: 200
  robotnik_base_controller:
    ros__parameters:
      use_sim_time: true
      publish_rate: 200
      profile: base
      debug: true
      open_loop: true
      joint_command_timeout: 0.1
      cmd_vel_timeout: 1.0
      odom_frame_id: robot_odom
      base_frame_id: robot_base_footprint
      use_2D_odom: true
      wheel_radius: 0.1125
      track_width: 0.47
      wheel_base: 0.458
      max_steering_position_error: 0.0
      base:
        linear:
          x:
            velocity:
              min: -1.0
              max: 1.0
            acceleration:
              min: -1.0
              max: 1.0
          y:
            velocity:
              min: -1.0
              max: 1.0
            acceleration:
              min: -1.0
              max: 1.0
        angular:
          z:
            velocity:
              min: -1.0
              max: 1.0
            acceleration:
              min: -1.0
              max: 1.0
        front_right:
          traction:
            joint_name: robot_front_right_wheel_joint
            limits:
              velocity:
                min: -27.7
                max: 27.7
              acceleration:
                min: -10.0
                max: 10.0
        front_left:
          traction:
            joint_name: robot_front_left_wheel_joint
            limits:
              velocity:
                min: -27.7
                max: 27.7
              acceleration:
                min: -10.0
                max: 10.0
        back_right:
          traction:
            joint_name: robot_back_right_wheel_joint
            limits:
              velocity:
                min: -27.7
                max: 27.7
              acceleration:
                min: -10.0
                max: 10.0
        back_left:
          traction:
            joint_name: robot_back_left_wheel_joint
            limits:
              velocity:
                min: -27.7
                max: 27.7
              acceleration:
                min: -10.0
                max: 10.0
  joint_trajectory_controller:
    ros__parameters:
      publish_rate: 50
      joints: []
      command_interfaces:
      - position
      state_interfaces:
      - position
      - velocity
      state_publish_rate: 50.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      open_loop_control: true
  ros2_control_node:
    ros__parameters:
      mujoco_plugins:
        mujoco_3d_lidar_plugin:
          type: mujoco_ros2_control_plugins/Mujoco3dLidarPlugin
          lidar_sensor_name: lidar_main
          frame_name: top_3d_laser_link
          topic: lidar_top/points
          publish_rate: 10.0
          max_range: 100.0
          min_range: 0.1
          num_samples: 360
        mujoco_camera_plugin:
          type: mujoco_ros2_control_plugins/CameraPlugin
          camera_publish_rate: 10.0
          robot_front_rgbd_camera_color:
            policy: streaming
            frame_name: robot_front_rgbd_camera_color_frame
            info_topic: mujoco_camera_plugin/robot_front_rgbd_camera_color/camera_info
            image_topic: mujoco_camera_plugin/robot_front_rgbd_camera_color/color
            depth_topic: mujoco_camera_plugin/robot_front_rgbd_camera_color/depth
            depth_encoding: 32FC1
          robot_top_ptz_camera:
            policy: streaming
            frame_name: robot_top_ptz_camera_frame
            info_topic: mujoco_camera_plugin/robot_top_ptz_camera/camera_info
            image_topic: mujoco_camera_plugin/robot_top_ptz_camera/color
            depth_topic: mujoco_camera_plugin/robot_top_ptz_camera/depth
            depth_encoding: 32FC1
